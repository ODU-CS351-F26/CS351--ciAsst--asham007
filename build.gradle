//gitPublishCopy.dependsOn site
gitPublish {
    repoUri = 'https://github.com/ODU-CS351-F26/CS351--ciAsst--asham007.git'
    
    branch = 'gh-pages'
    
    contents {
        from 'build/reports'
    }

    credentials {
        username = "deploy-token"
        password = System.getenv("GITHUB_TOKEN")
    }


    commitMessage = "Updating webpages at ${new Date().format('yyyy-MM-dd HH:mm:ss')}"
}

gitPublishCopy.dependsOn reports
tasks.register("deployReports") {
    dependsOn(
        "gitPublishReset",
        "gitPublishCopy",
        "gitPublishCommit",
        "gitPublishPush"
    )
}

java {
    sourceCompatibility = JavaVersion.toVersion(17)
    targetCompatibility = JavaVersion.toVersion(17)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}
