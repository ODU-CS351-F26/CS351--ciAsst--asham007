plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}

test {
    ignoreFailures = true
}

task reports (type: Copy, dependsOn: ['build', 'javadoc']) {
    from 'src/main/html'
    from 'build/docs'
    into 'build/reports'
}

