name: CI - build and test

on:                                
  push:
    branches: [ main ]

jobs:

  permissions:
    contents: write

  build:                           

    runs-on: ubuntu-latest         

    steps:    
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v2        
      with:
        java-version: '17'
        distribution: 'adopt'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew              
    - name: Build and test
      run: ./gradlew deployReports
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
